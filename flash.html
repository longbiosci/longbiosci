      <a href="/evidence/" aria-label="证据分级">证据<span class="nav-mq">分级</span></a>

    </nav>
  </div>
</header>
<main id="main-content">
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <h1>快讯</h1>
        <span class="section-note" id="flashMeta">加载中…</span>
      </div>
      <p class="flash-intro">本栏目由午刊班每日 13:30 后直发，聚焦当日行业与文献的快节奏情报（300–500 字），每条带<strong>数据日期 + 生成时间</strong>与可核验来源（DOI/PMID/NCT/官方 URL）。快讯不进入主内容库（<code>articles.json</code>），与全站研究解读相互独立；满 30 条自动滚动淘汰最旧。</p>
      <div id="flashList"><p>加载中…</p></div>
    </div>
  </section>
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>© 2026 LongBiosci · 衰老与长寿科技资讯
    <a href="/rss.xml">RSS</a> · <a href="/">返回首页</a>
  </div>
</footer>
<script>
(function () {
  var list = document.getElementById('flashList'), meta = document.getElementById('flashMeta');
  fetch('/data/flash.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
    var items = (d && Array.isArray(d.items)) ? d.items : [];
    meta.textContent = '共 ' + items.length + ' 条 · 更新于 ' + ((d && d.updated_at) || '—');
    if (!items.length) { list.innerHTML = '<p>暂无快讯。今日内容请见 <a href="/news/">最新收录</a>。</p>'; return; }
    list.innerHTML = items.map(function (it) {
      var src = it.source_url ? ' · <a href="' + it.source_url + '" target="_blank" rel="noopener">原文来源</a>' : '';
      return '<article class="flash-card"><div class="item-meta"><span class="tag">快讯</span>'
        + '<span class="tag-date">' + (it.date || '') + ' 数据 · ' + (it.generated_at || '') + ' 生成</span></div>'
        + '<h3>' + it.title + '</h3><p>' + (it.summary || '') + '</p>'
        + '<div class="card-foot"><span>' + (it.source || '') + src + '</span></div></article>';
    }).join('');
  }).catch(function () { list.innerHTML = '<p>快讯数据暂时不可用，请稍后刷新。</p>'; });
})();
</script>
</body>
</html>
