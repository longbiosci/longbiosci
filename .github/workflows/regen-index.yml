name: Regen rss/sitemap index

# ⚠️ 2026-10-14 起改为**仅手动触发**。
# 原因：本工作流用的 scripts/gen_index.py + scripts/gen_site.py 是
# 「栏目重建前的旧版生成器」，产物严格劣于现行本地管线
# （build-index.py → sync-evidence.py → gen-home.py → gen-topic-pages.py →
#   gen-news-index.py → gen-evidence-pages.py → rebuild-sitemap.py →
#   add-rss-today-run.py → inject-poster.py），且缺少 sync-search-index 等后半段。
# 实测被覆盖的差异：
#   sitemap.xml        460 loc → 385 loc（丢失 topics/ evidence/ daily/
#                      research/ privacy/ trials.html 与全部概念单页）
#   search-index.json  395 条 → 380 条（丢失 15 条栏目/工具类条目）
#   rss.xml53 item → 50 item
#   并会删除 evidence/B-10~B-12、topics/cellular-senescence-3、
#   topics/methods-tools-2 等有效分页。
# 即：每次 push data/articles.json 都会静默把站点降级。
# 现改为不自动触发，避免与本地管线的产出互相覆盖。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regen-index
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild rss.xml and sitemap.xml
        run: python3 scripts/gen_index.py

      - name: Rebuild site index pages
        run: python3 scripts/gen_site.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- rss.xml sitemap.xml index.html news topics evidence data/search-index.json; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml sitemap.xml index.html news topics evidence data/search-index.json
          git commit -m "chore: auto-regen site indexes from articles.json"
          git push
